<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Perfil | B&amp;F Importes</title>
    <link rel="icon" href="https://trirxmcalxktampbujyr.supabase.co/storage/v1/object/public/anuncios/logo.webp" type="image/webp">
    <link rel="stylesheet" href="/assets/css/account.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body data-account-page="profile">
    <main class="account-shell"><div class="account-wrap">
        <nav class="account-nav"><a class="account-brand" href="/"><img src="https://trirxmcalxktampbujyr.supabase.co/storage/v1/object/public/anuncios/logo.webp" alt="B&amp;F Importes"><span>B&amp;F Importes</span></a><a class="account-back" href="/">Voltar ao início</a></nav>
        <header class="account-heading"><h1>Seu perfil</h1><p>Atualize seus dados de contato para manter seu atendimento em dia.</p></header>
        <section class="account-card"><form class="account-form" id="profileForm"><div class="account-field"><label for="profileName">Nome</label><input id="profileName" autocomplete="name"></div><div class="account-field"><label for="profilePhone">Telefone</label><input id="profilePhone" autocomplete="tel"></div><div class="account-field full"><label for="profileEmail">E-mail</label><input id="profileEmail" type="email" readonly></div><button class="account-action" type="submit">Salvar dados</button><div class="account-status" id="accountStatus" aria-live="polite"></div></form></section>
    </div></main>
    <script src="/assets/js/account.js"></script>
</body>
</html>
