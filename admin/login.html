<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Painel Admin B&amp;F</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{
            --brand:#3b82f6; --brand-hover:#2563eb;
            --bg:#070d1b; --card:rgba(15,23,42,.55);
            --input:rgba(7,13,27,.65); --border:rgba(255,255,255,.1);
            --text:#e2e8f0; --text-muted:#94a3b8; --danger:#ef4444;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'Segoe UI',system-ui,sans-serif;
            min-height:100vh;display:flex;align-items:center;justify-content:center;
            background:radial-gradient(1200px 700px at 20% -10%, rgba(59,130,246,.25), transparent 60%),
                       radial-gradient(900px 600px at 110% 110%, rgba(37,99,235,.18), transparent 60%),
                       var(--bg);
            color:var(--text);padding:20px;position:relative;overflow:hidden;
        }
        .login-card{
            width:400px;max-width:100%;
            background:var(--card);
            backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
            border:1px solid var(--border);border-radius:20px;
            padding:44px 36px;
            box-shadow:0 24px 60px rgba(0,0,0,.55);
            position:relative;z-index:1;
        }
        .login-brand{display:flex;flex-direction:column;align-items:center;margin-bottom:30px;}
        .login-icon{
            width:56px;height:56px;border-radius:16px;
            background:linear-gradient(135deg,var(--brand),var(--brand-hover));
            display:flex;align-items:center;justify-content:center;
            color:#fff;margin-bottom:16px;
            box-shadow:0 10px 24px rgba(59,130,246,.4);
        }
        .login-brand h1{font-size:1.25rem;font-weight:800;letter-spacing:.3px;}
        .login-brand p{font-size:.82rem;color:var(--text-muted);margin-top:4px;}
        .field{margin-bottom:16px;}
        .field label{display:block;font-size:.76rem;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
        .input-wrap{position:relative;}
        .input-wrap .lead{
            position:absolute;left:12px;top:50%;transform:translateY(-50%);
            color:var(--text-muted);display:flex;pointer-events:none;
        }
        .field input{
            width:100%;padding:12px 42px 12px 40px;
            background:var(--input);border:1px solid var(--border);
            border-radius:10px;color:var(--text);font-size:.9rem;font-family:inherit;
            outline:none;transition:border-color .2s, box-shadow .2s;
        }
        .field input::placeholder{color:var(--text-muted);opacity:.6;}
        .field input:focus{
            border-color:var(--brand);
            box-shadow:0 0 0 3px rgba(59,130,246,.25);
        }
        .eye-toggle{
            position:absolute;right:8px;top:50%;transform:translateY(-50%);
            background:none;border:none;color:var(--text-muted);cursor:pointer;
            padding:6px;border-radius:6px;display:flex;transition:color .15s, background .15s;
        }
        .eye-toggle:hover{color:var(--text);background:rgba(255,255,255,.06);}
        .btn-login{
            width:100%;padding:13px 0;margin-top:6px;
            background:var(--brand);color:#fff;border:none;border-radius:10px;
            font-weight:700;font-size:.95rem;cursor:pointer;font-family:inherit;
            letter-spacing:.2px;transition:background .2s, box-shadow .2s, transform .15s;
        }
        .btn-login:hover{
            background:var(--brand-hover);
            box-shadow:0 10px 28px rgba(59,130,246,.45);
            transform:translateY(-1px);
        }
        .btn-login:active{transform:translateY(0);}
        .btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none;}
        .back-site{display:block;text-align:center;margin-top:20px;font-size:.82rem;color:var(--text-muted);text-decoration:none;transition:color .15s;}
        .back-site:hover{color:var(--text);}
        .toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
        .toast{
            background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);
            color:#fecaca;padding:12px 18px;border-radius:10px;font-size:.82rem;font-weight:600;
            box-shadow:0 4px 16px rgba(0,0,0,.4);backdrop-filter:blur(8px);
            animation:toastIn .35s ease,toastOut .3s ease 3.2s forwards;max-width:340px;
        }
        @keyframes toastIn{from{opacity:0;transform:translateX(80px)}to{opacity:1;transform:translateX(0)}}
        @keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(80px)}}
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-brand">
            <div class="login-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h1>Painel Admin</h1>
            <p>B&amp;F Importes</p>
        </div>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="email">E-mail</label>
                <div class="input-wrap">
                    <span class="lead">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    </span>
                    <input type="email" id="email" name="email" autocomplete="username" placeholder="seu@email.com" required>
                </div>
            </div>

            <div class="field">
                <label for="password">Senha</label>
                <div class="input-wrap">
                    <span class="lead">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="22" y1="3" x2="16" y2="9"/></svg>
                    </span>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Sua senha" required>
                    <button type="button" class="eye-toggle" id="togglePass" aria-label="Mostrar senha">
                        <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btnSubmit">Entrar</button>
        </form>

        <a class="back-site" href="../index.html">&larr; Voltar ao site</a>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function(){
            var SUPABASE_URL = 'https://trirxmcalxktampbujyr.supabase.co';
            var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyaXJ4bWNhbHhrdGFtcGJ1anlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MjU3MzEsImV4cCI6MjEwMjIwMTczMX0.sr6dx1qSK8cqV4e1g6-jMz99T2WTw9Q0jX1iHb-Vwy4';
            var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            function showToast(msg){
                var c = document.getElementById('toastContainer');
                var t = document.createElement('div');
                t.className = 'toast';
                t.textContent = msg;
                c.appendChild(t);
                setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 3500);
            }

            /* toggle visibilidade da senha */
            var pass = document.getElementById('password');
            var eyeOpen = document.getElementById('eyeOpen');
            var eyeClosed = document.getElementById('eyeClosed');
            document.getElementById('togglePass').addEventListener('click', function(){
                var show = pass.type === 'password';
                pass.type = show ? 'text' : 'password';
                eyeOpen.style.display = show ? 'none' : 'block';
                eyeClosed.style.display = show ? 'block' : 'none';
                this.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
            });

            /* se já estiver autenticado, vai direto para o painel */
            supabase.auth.getSession().then(function(res){
                if(res.data && res.data.session){ window.location.replace('index.html'); }
            });

            document.getElementById('loginForm').addEventListener('submit', async function(e){
                e.preventDefault();
                var email = document.getElementById('email').value.trim();
                var password = document.getElementById('password').value;
                if(!email || !password){ showToast('Preencha e-mail e senha.'); return; }

                var btn = document.getElementById('btnSubmit');
                btn.disabled = true;
                btn.textContent = 'Entrando...';

                var res = await supabase.auth.signInWithPassword({ email: email, password: password });
                if(res.error){
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                    var msg = res.error.code === 'invalid_credentials'
                        ? 'E-mail ou senha incorretos.'
                        : 'Falha ao entrar: ' + res.error.message;
                    showToast(msg);
                    return;
                }
                window.location.replace('index.html');
            });
        })();
    </script>
</body>
</html>
